name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check application files
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            android/MainActivity.java \
            android/StoreActivity.java \
            android/ShopApi.java \
            android/ProductArtwork.java \
            android/ProductPhoto.java \
            android/PushNotifications.java \
            android/OrderPushSubscriptions.java \
            android/ShopContacts.java \
            android/BrandLoading.java \
            android/google-services.json \
            signing/lavka-release.p12.gpg
          do
            if [ ! -s "$file" ]; then
              echo "::error::Missing or empty file: $file"
              exit 1
            fi
          done

          python3 - <<'PY'
          import json

          with open(
              "android/google-services.json",
              encoding="utf-8"
          ) as source:
              config = json.load(source)

          package_names = [
              client.get("client_info", {})
                    .get("android_client_info", {})
                    .get("package_name")
              for client in config.get("client", [])
          ]

          if "ru.makeevka.fishshop" not in package_names:
              raise SystemExit(
                  "Firebase config must contain package "
                  "ru.makeevka.fishshop"
              )

          print("Firebase Android package verified")
          PY

      - name: Decrypt signing key
        shell: bash
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail

          if [ "${#SIGNING_PASSWORD}" -lt 32 ]; then
            echo "::error::SIGNING_PASSWORD is missing or too short"
            exit 1
          fi

          KEY_DIR="$RUNNER_TEMP/lavka-signing"
          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"

          printf '%s' "$SIGNING_PASSWORD" | \
            gpg --batch --yes \
              --pinentry-mode loopback \
              --passphrase-fd 0 \
              --output "$KEY_DIR/lavka-release.p12" \
              --decrypt signing/lavka-release.p12.gpg

          chmod 600 "$KEY_DIR/lavka-release.p12"

          keytool -list \
            -keystore "$KEY_DIR/lavka-release.p12" \
            -storetype PKCS12 \
            -storepass:env SIGNING_PASSWORD \
            -alias lavka > /dev/null

          echo "SIGNING_KEYSTORE=$KEY_DIR/lavka-release.p12" \
            >> "$GITHUB_ENV"

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/ru/makeevka/fishshop
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-v31
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'LavkaVkusa'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }

          def buildNumber = Integer.parseInt(
              System.getenv('GITHUB_RUN_NUMBER') ?: '1'
          )

          android {
              namespace 'ru.makeevka.fishshop'
              compileSdk 35

              defaultConfig {
                  applicationId 'ru.makeevka.fishshop'
                  minSdk 26
                  targetSdk 34
                  versionCode 1000 + buildNumber
                  versionName "0.8-gold-wave.${buildNumber}"
              }

              signingConfigs {
                  release {
                      storeFile file(
                          System.getenv('SIGNING_KEYSTORE')
                      )
                      storePassword System.getenv(
                          'SIGNING_PASSWORD'
                      )
                      keyAlias 'lavka'
                      keyPassword System.getenv(
                          'SIGNING_PASSWORD'
                      )
                      storeType 'PKCS12'
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation platform(
                  'com.google.firebase:firebase-bom:33.7.0'
              )
              implementation 'com.google.firebase:firebase-messaging'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:label="Лавка Вкуса"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/LavkaTheme">

                  <meta-data
                      android:name="com.google.firebase.messaging.default_notification_icon"
                      android:resource="@drawable/ic_notification" />

                  <meta-data
                      android:name="com.google.firebase.messaging.default_notification_color"
                      android:resource="@color/notification_gold" />

                  <meta-data
                      android:name="com.google.firebase.messaging.default_notification_channel_id"
                      android:value="lavka_orders_v1" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".PushNotifications$MessagingService"
                      android:exported="false">

                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT" />
                      </intent-filter>

                  </service>

              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="notification_gold">#D4AF37</color>
              <color name="lavka_black">#0E0F11</color>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LavkaTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@color/lavka_black</item>
                  <item name="android:statusBarColor">@color/lavka_black</item>
                  <item name="android:navigationBarColor">@color/lavka_black</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
                  <item name="android:colorAccent">@color/notification_gold</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values-v31/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LavkaTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@color/lavka_black</item>
                  <item name="android:statusBarColor">@color/lavka_black</item>
                  <item name="android:navigationBarColor">@color/lavka_black</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
                  <item name="android:colorAccent">@color/notification_gold</item>
                  <item name="android:windowSplashScreenBackground">@color/lavka_black</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/ic_lavka_foreground</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_notification.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M3,19 L8,5 L12,5 L16,19 L12,19 L10,10 L7,19 Z M17,5 L21,5 L21,19 L17,19 Z" />
          </vector>
          EOF

          cp android/*.java \
            app/src/main/java/ru/makeevka/fishshop/

          cp android/google-services.json \
            app/google-services.json

      - name: Connect gold wave loading screen
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/ru/makeevka/fishshop/"
              "StoreActivity.java"
          )
          source = path.read_text(encoding="utf-8")

          if "lavkaBrandLoading" in source:
              raise SystemExit(
                  "Loading screen is already connected. "
                  "Do not apply the same integration twice."
              )

          changes = [
              (
                  "public class StoreActivity extends Activity {",
                  "public class StoreActivity extends Activity {\n"
                  "    private BrandLoading lavkaBrandLoading;\n"
              ),
              (
                  "        setContentView(root);\n",
                  "        setContentView(root);\n"
                  "        if (state == null || "
                  "!state.getBoolean("
                  "\"lavka_loading_finished\", false)) {\n"
                  "            lavkaBrandLoading = new BrandLoading("
                  "this, this::loadCatalog);\n"
                  "        }\n"
              ),
              (
                  "    private void render(boolean keepPosition) {\n"
                  "        if (destroyed) return;\n",
                  "    private void render(boolean keepPosition) {\n"
                  "        if (destroyed) return;\n"
                  "        if (lavkaBrandLoading != null) {\n"
                  "            lavkaBrandLoading.update("
                  "loadingCatalog, freshCatalog);\n"
                  "        }\n"
              ),
              (
                  "    private void message(String title, String body) {\n"
                  "        if (destroyed || isFinishing()) return;\n",
                  "    private void message(String title, String body) {\n"
                  "        if (destroyed || isFinishing()) return;\n"
                  "        if (lavkaBrandLoading != null &&\n"
                  "                lavkaBrandLoading.isBlocking() &&\n"
                  "                \"Каталог\".equals(title)) {\n"
                  "            lavkaBrandLoading.showError(body);\n"
                  "            return;\n"
                  "        }\n"
              ),
              (
                  "    protected void onDestroy() {\n",
                  "    protected void onDestroy() {\n"
                  "        if (lavkaBrandLoading != null) {\n"
                  "            lavkaBrandLoading.dispose();\n"
                  "        }\n"
              ),
          ]

          for old, new in changes:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      "StoreActivity structure differs from expected. "
                      "Integration stopped safely. "
                      "Unmatched fragment: " + old.splitlines()[0]
                  )
              source = source.replace(old, new, 1)

          if "onSaveInstanceState(" in source:
              raise SystemExit(
                  "Existing state-saving method detected. "
                  "Integration requires review."
              )

          state_method = '''
              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  outState.putBoolean(
                          "lavka_loading_finished",
                          lavkaBrandLoading == null ||
                          lavkaBrandLoading.isFinished()
                  );
                  super.onSaveInstanceState(outState);
              }

          '''

          marker = "    @Override\n    protected void onDestroy() {"

          if source.count(marker) != 1:
              raise SystemExit(
                  "Cannot locate lifecycle insertion point."
              )

          source = source.replace(
              marker, state_method + marker, 1
          )

          path.write_text(source, encoding="utf-8")
          print(
              "Gold wave connected to build copy. "
              "Repository source remains unchanged."
          )
          PY

      - name: Create black and gold icon
        shell: bash
        run: |
          set -euo pipefail

          cat > app/src/main/res/drawable/ic_lavka_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#121212" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/ic_lavka_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#D4AF37"
                  android:strokeWidth="1.2"
                  android:pathData="M54,25 A29,29 0,1 1,54,83 A29,29 0,1 1,54,25" />

              <path
                  android:fillColor="#D4AF37"
                  android:pathData="M31,68 L40,39 L49,39 L55,68 L49,68 L44,45 L36,68 Z" />

              <path
                  android:fillColor="#D4AF37"
                  android:fillType="evenOdd"
                  android:pathData="M58,39 L69,39 C80,39 82,51 74,54 C84,58 80,68 69,68 L58,68 Z M64,44 L64,51 L69,51 C75,51 75,44 69,44 Z M64,57 L64,63 L69,63 C76,63 76,57 69,57 Z" />

          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_lavka_background" />
              <foreground android:drawable="@drawable/ic_lavka_foreground" />
          </adaptive-icon>
          EOF

      - name: Build signed APK
        shell: bash
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon assembleRelease

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: fish-shop-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove decrypted signing key
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/lavka-signing"
