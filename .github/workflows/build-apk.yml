name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Prepare Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/ru/makeevka/fishshop
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'LavkaVkusa'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ru.makeevka.fishshop'
              compileSdk 35

              defaultConfig {
                  applicationId 'ru.makeevka.fishshop'
                  minSdk 26
                  targetSdk 34
                  versionCode 4
                  versionName '0.4-test'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:label="Лавка Вкуса"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>
                          <action
                              android:name="android.intent.action.MAIN" />
                          <category
                              android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

      - name: Connect store application
        shell: bash
        run: |
          test -s android/MainActivity.java
          test -s android/StoreActivity.java
          test -s android/ShopApi.java

          cp android/MainActivity.java \
            app/src/main/java/ru/makeevka/fishshop/MainActivity.java

          cp android/StoreActivity.java \
            app/src/main/java/ru/makeevka/fishshop/StoreActivity.java

          cp android/ShopApi.java \
            app/src/main/java/ru/makeevka/fishshop/ShopApi.java

      - name: Create black and gold icon
        shell: bash
        run: |
          cat > app/src/main/res/drawable/ic_lavka_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#121212" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/ic_lavka_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#D4AF37"
                  android:pathData="M27,70 L38,38 L47,38 L58,70 L50,70 L42.5,47 L35,70 Z" />

              <path
                  android:fillColor="#D4AF37"
                  android:fillType="evenOdd"
                  android:pathData="M60,38 L72,38 C84,38 86,51 78,54 C88,57 85,70 73,70 L60,70 Z M67,44 L67,51 L72,51 C78,51 78,44 72,44 Z M67,57 L67,64 L73,64 C80,64 80,57 73,57 Z" />
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_lavka_background" />
              <foreground android:drawable="@drawable/ic_lavka_foreground" />
          </adaptive-icon>
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: fish-shop-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
