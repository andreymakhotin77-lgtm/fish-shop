name: Connect shop settings

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Connect settings safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact_line(source, old_line, new_text, label):
              lines = source.splitlines(keepends=True)
              matches = [
                  index
                  for index, line in enumerate(lines)
                  if line.rstrip("\r\n") == old_line
              ]

              if len(matches) != 1:
                  raise SystemExit(
                      f"{label}: expected one matching line, "
                      f"found {len(matches)}. No files changed."
                  )

              lines[matches[0]] = new_text.rstrip("\n") + "\n"
              return "".join(lines)

          store_path = Path("android/StoreActivity.java")
          settings_path = Path("android/ShopSettings.java")
          main_path = Path("android/MainActivity.java")

          for path in (store_path, settings_path, main_path):
              if not path.is_file():
                  raise SystemExit(f"Missing file: {path}")

          store = store_path.read_text(encoding="utf-8")
          settings = settings_path.read_text(encoding="utf-8")
          main = main_path.read_text(encoding="utf-8")

          if "public void openShopSettings()" not in main:
              raise SystemExit(
                  "Update MainActivity.java before running this workflow."
              )

          profile_marker = "// LAVKA_SHOP_SETTINGS_LINK"

          if profile_marker not in store:
              anchor = '        section("Мой профиль");'

              addition = "\n".join([
                  anchor,
                  "",
                  "        // LAVKA_SHOP_SETTINGS_LINK",
                  "        content.addView(secondary(",
                  '                "Настройки приложения  ›",',
                  "                () -> {",
                  "                    if (this instanceof MainActivity) {",
                  "                        ((MainActivity) this).openShopSettings();",
                  "                    }",
                  "                }",
                  "        ));",
              ])

              store = replace_exact_line(
                  store,
                  anchor,
                  addition,
                  "Profile structure check"
              )

          lifecycle_marker = "// LAVKA_SETTINGS_DIALOG_LIFECYCLE"

          if lifecycle_marker not in settings:
              class_anchor = "public final class ShopSettings {"

              lifecycle = "\n".join([
                  class_anchor,
                  "",
                  "    // LAVKA_SETTINGS_DIALOG_LIFECYCLE",
                  "    private static AlertDialog activeDialog;",
                  "",
                  "    public static void dismiss() {",
                  "        AlertDialog previous = activeDialog;",
                  "        activeDialog = null;",
                  "",
                  "        if (previous != null && previous.isShowing()) {",
                  "            previous.dismiss();",
                  "        }",
                  "    }",
              ])

              settings = replace_exact_line(
                  settings,
                  class_anchor,
                  lifecycle,
                  "ShopSettings class check"
              )

              settings = replace_exact_line(
                  settings,
                  "        dialog.show();",
                  "\n".join([
                      "        activeDialog = dialog;",
                      "        dialog.show();",
                  ]),
                  "Settings dialog check"
              )

              settings = replace_exact_line(
                  settings,
                  "        new AlertDialog.Builder(",
                  "        AlertDialog choice = new AlertDialog.Builder(",
                  "Delay chooser check"
              )

              settings = replace_exact_line(
                  settings,
                  "                .show();",
                  "\n".join([
                      "                .create();",
                      "",
                      "        activeDialog = choice;",
                      "        choice.show();",
                  ]),
                  "Delay chooser ending check"
              )

          required_settings_fragments = [
              lifecycle_marker,
              "public static void dismiss()",
              "activeDialog = dialog;",
              "AlertDialog choice = new AlertDialog.Builder(",
              "activeDialog = choice;",
              "choice.show();",
          ]

          for fragment in required_settings_fragments:
              if fragment not in settings:
                  raise SystemExit(
                      "Settings integration check failed. No files changed."
                  )

          if (
              profile_marker not in store
              or "((MainActivity) this).openShopSettings();" not in store
          ):
              raise SystemExit(
                  "Profile integration check failed. No files changed."
              )

          store_path.write_text(store, encoding="utf-8")
          settings_path.write_text(settings, encoding="utf-8")

          print("Settings connected successfully.")
          PY

      - name: Save changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android/StoreActivity.java android/ShopSettings.java

          if git diff --cached --quiet; then
            echo "Settings are already connected"
          else
            git commit -m "Connect shop settings and dialog lifecycle"
            git push origin HEAD:main
          fi

      - name: Start APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --ref main
