name: Connect shop settings

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Connect settings safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          store_path = Path("android/StoreActivity.java")
          settings_path = Path("android/ShopSettings.java")
          main_path = Path("android/MainActivity.java")

          for path in (store_path, settings_path, main_path):
              if not path.is_file():
                  raise SystemExit(f"Missing file: {path}")

          store = store_path.read_text(encoding="utf-8")
          settings = settings_path.read_text(encoding="utf-8")
          main = main_path.read_text(encoding="utf-8")

          if "public void openShopSettings()" not in main:
              raise SystemExit(
                  "Update MainActivity.java before running this workflow"
              )

          profile_marker = "// LAVKA_SHOP_SETTINGS_LINK"

          if profile_marker not in store:
              anchor = '        section("Мой профиль");'
              if store.count(anchor) != 1:
                  raise SystemExit(
                      "Profile structure differs. No files changed."
                  )

              addition = '''
                  // LAVKA_SHOP_SETTINGS_LINK
                  content.addView(secondary(
                          "Настройки приложения  ›",
                          () -> {
                              if (this instanceof MainActivity) {
                                  ((MainActivity) this).openShopSettings();
                              }
                          }
                  ));
          '''

              store = store.replace(
                  anchor,
                  anchor + "\n" + addition,
                  1
              )

          lifecycle_marker = "// LAVKA_SETTINGS_DIALOG_LIFECYCLE"

          if lifecycle_marker not in settings:
              class_anchor = "public final class ShopSettings {"

              if settings.count(class_anchor) != 1:
                  raise SystemExit(
                      "ShopSettings class differs. No files changed."
                  )

              lifecycle = '''
              // LAVKA_SETTINGS_DIALOG_LIFECYCLE
              private static AlertDialog activeDialog;

              public static void dismiss() {
                  AlertDialog previous = activeDialog;
                  activeDialog = null;

                  if (previous != null && previous.isShowing()) {
                      previous.dismiss();
                  }
              }
          '''

              settings = settings.replace(
                  class_anchor,
                  class_anchor + "\n" + lifecycle,
                  1
              )

              main_show = "        dialog.show();"

              if settings.count(main_show) != 1:
                  raise SystemExit(
                      "Settings dialog structure differs. No files changed."
                  )

              settings = settings.replace(
                  main_show,
                  "        activeDialog = dialog;\n" + main_show,
                  1
              )

              choice_start = "        new AlertDialog.Builder(\n"

              if settings.count(choice_start) != 1:
                  raise SystemExit(
                      "Delay chooser structure differs. No files changed."
                  )

              settings = settings.replace(
                  choice_start,
                  "        AlertDialog choice = new AlertDialog.Builder(\n",
                  1
              )

              choice_end = "                .show();"

              if settings.count(choice_end) != 1:
                  raise SystemExit(
                      "Delay chooser ending differs. No files changed."
                  )

              settings = settings.replace(
                  choice_end,
                  "                .create();\n"
                  "\n"
                  "        activeDialog = choice;\n"
                  "        choice.show();",
                  1
              )

          if "public static void dismiss()" not in settings:
              raise SystemExit("Settings lifecycle check failed")

          if profile_marker not in store:
              raise SystemExit("Profile integration check failed")

          store_path.write_text(store, encoding="utf-8")
          settings_path.write_text(settings, encoding="utf-8")

          print("Settings connected successfully")
          PY

      - name: Save changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android/StoreActivity.java android/ShopSettings.java

          if git diff --cached --quiet; then
            echo "Settings are already connected"
          else
            git commit -m "Connect shop settings and dialog lifecycle"
            git push origin HEAD:main
          fi

      - name: Start APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --ref main
